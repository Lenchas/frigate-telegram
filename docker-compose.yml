# Created by AI Cursor
---
version: '3'
networks:
  net:

services:
  redis:
    image: redis:7.2.3-alpine3.18
    networks: [net]
    restart: always
    command:
      - 'redis-server'
      - '--save 900 1'
      - '--save 300 10'
      - '--save 60 100'
    volumes:
      - /mnt/docker/redis/data:/data

  frigate-telegram:
    image: frigate-telegram:reviews
    build:
      context: .
      dockerfile: docker/amd64/Dockerfile
    restart: always
    networks: [net]
    ports: 
      - 8080:8080
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FRIGATE_URL: http://192.168.0.254:5000
      FRIGATE_EVENT_LIMIT: 5
      DEBUG: False
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SLEEP_TIME: 10
      FRIGATE_EXTERNAL_URL: https://frigate.domain.com
      TZ: Europe/Berlin
      REDIS_ADDR: "redis:6379"
      REST_API_ENABLE: False
      FRIGATE_INCLUDE_SEVERITY: "alert"
      FRIGATE_INCLUDE_LABEL: "person,car"
      NOTIFICATION_MODE: "reviews"
      REVIEW_MAX_WAIT_SECONDS: 60
      CLIP_MAX_SECONDS: 30
      MEDIA_MAX_BYTES: 25000000
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: tmpfs # Optional
        target: /tmp
        tmpfs:
          size: 134217728
